<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Rifa en Equipo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="bg-white shadow rounded-lg p-6 mb-6 text-center">
            <h1 class="text-3xl font-bold text-indigo-600 mb-2">🎟️ Control de Rifa en Equipo</h1>
            <p class="text-slate-500">Sincronizado en tiempo real</p>
        </header>

        <!-- Configuración de Precio y Estadísticas -->
        <div class="bg-white p-4 rounded-lg shadow mb-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2">
                <label class="text-sm font-semibold text-slate-700">Precio por Boleto (S/):</label>
                <input type="number" id="precioBoletoInput" value="5" min="1" class="w-24 border rounded p-1 text-center font-bold text-indigo-600 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <p class="text-xs text-slate-400">Puedes cambiar el precio en cualquier momento</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-indigo-500">
                <p class="text-sm text-slate-500">Total Recaudado</p>
                <p id="totalRecaudado" class="text-2xl font-bold text-slate-700">S/ 0.00</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-emerald-500">
                <p class="text-sm text-slate-500">Números Vendidos</p>
                <p id="totalVendidos" class="text-2xl font-bold text-emerald-600">0</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow border-l-4 border-amber-500">
                <p class="text-sm text-slate-500">Disponibles (de 100)</p>
                <p id="totalDisponibles" class="text-2xl font-bold text-amber-600">100</p>
            </div>
        </div>

        <!-- Formulario -->
        <div class="bg-white shadow rounded-lg p-6 mb-6">
            <h2 id="formTitulo" class="text-xl font-semibold mb-4 text-slate-700">Registrar Número</h2>
            <form id="rifaForm" class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">N° de Rifa</label>
                    <input type="number" id="numero" required class="w-full border rounded p-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ej. 1">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Comprador</label>
                    <input type="text" id="nombre" required class="w-full border rounded p-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Nombre">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Teléfono</label>
                    <input type="text" id="telefono" class="w-full border rounded p-2 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Opcional">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Estado</label>
                    <select id="estado" class="w-full border rounded p-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="Pagado">Pagado</option>
                        <option value="Pendiente">Pendiente</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button type="submit" id="btnGuardar" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium p-2 rounded transition">Guardar</button>
                </div>
            </form>
        </div>

        <!-- Tabla -->
        <div class="bg-white shadow rounded-lg p-6">
            <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-4">
                <h2 class="text-xl font-semibold text-slate-700">Inventario Actualizado</h2>
                <input type="text" id="buscador" placeholder="🔍 Buscar..." class="border rounded p-2 w-full md:w-72 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b text-slate-600 text-sm">
                            <th class="p-3">N°</th>
                            <th class="p-3">Comprador</th>
                            <th class="p-3">Teléfono</th>
                            <th class="p-3">Estado</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaRegistros" class="divide-y text-sm">
                        <tr><td colspan="5" class="p-4 text-center text-slate-400">Cargando datos...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ REEMPLAZA ESTA URL POR TU ENLACE DE GOOGLE APPS SCRIPT
        const URL_API = 'PEGA_AQUÍ_TU_URL_DE_GOOGLE_APPS_SCRIPT';
        
        let registros = [];

        const form = document.getElementById('rifaForm');
        const tabla = document.getElementById('tablaRegistros');
        const buscador = document.getElementById('buscador');
        const btnGuardar = document.getElementById('btnGuardar');
        const precioInput = document.getElementById('precioBoletoInput');

        precioInput.addEventListener('input', () => {
            renderizar(buscador.value);
        });

        async function cargarDatos() {
            try {
                let respuesta = await fetch(URL_API);
                registros = await respuesta.json();
                renderizar();
            } catch (error) {
                tabla.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">Error al cargar datos. Verifica la URL.</td></tr>`;
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnGuardar.innerText = 'Guardando...';
            btnGuardar.disabled = true;

            const datosNuevos = {
                numero: document.getElementById('numero').value,
                nombre: document.getElementById('nombre').value,
                telefono: document.getElementById('telefono').value || '---',
                estado: document.getElementById('estado').value
            };

            try {
                await fetch(URL_API, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datosNuevos)
                });

                form.reset();
                setTimeout(cargarDatos, 1500);
            } catch (error) {
                alert('Hubo un error al guardar.');
            } finally {
                btnGuardar.innerText = 'Guardar';
                btnGuardar.disabled = false;
            }
        });

        // Función para cargar los datos en el formulario y editarlos/actualizarlos
        window.editarBoleto = function(num, nom, tel, est) {
            document.getElementById('numero').value = num;
            document.getElementById('nombre').value = nom;
            document.getElementById('telefono').value = tel === '---' ? '' : tel;
            document.getElementById('estado').value = est;
            document.getElementById('numero').focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        buscador.addEventListener('input', (e) => {
            renderizar(e.target.value);
        });

        function renderizar(filtro = '') {
            tabla.innerHTML = '';
            let pagadosCount = 0;
            const precioBoleto = parseFloat(precioInput.value) || 0;

            const filtrados = registros.filter(r => {
                const nombreVal = String(r.Nombre || r.nombre || '').toLowerCase();
                const numVal = String(r.Numero || r.numero || '');
                return nombreVal.includes(filtro.toLowerCase()) || numVal.includes(filtro);
            });

            if(filtrados.length === 0) {
                tabla.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400">No hay registros encontrados</td></tr>`;
                return;
            }

            filtrados.sort((a, b) => {
                const numA = parseInt(a.Numero || a.numero || 0);
                const numB = parseInt(b.Numero || b.numero || 0);
                return numA - numB;
            });

            filtrados.forEach(r => {
                const num = r.Numero || r.numero || '---';
                const nom = r.Nombre || r.nombre || '---';
                const tel = r.Telefono || r.telefono || '---';
                const est = r.Estado || r.estado || 'Pendiente';

                if(est === 'Pagado') pagadosCount++;
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-bold text-indigo-600">#${num}</td>
                    <td class="p-3">${nom}</td>
                    <td class="p-3">${tel}</td>
                    <td class="p-3">
                        <span class="px-2 py-1 rounded text-xs font-semibold ${est === 'Pagado' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                            ${est}
                        </span>
                    </td>
                    <td class="p-3 text-center">
                        <button onclick="editarBoleto('${num}', '${nom}', '${tel}', '${est}')" class="bg-slate-100 hover:bg-indigo-50 text-indigo-600 text-xs px-3 py-1 rounded font-semibold transition">Editar / Cambiar</button>
                    </td>
                `;
                tabla.appendChild(tr);
            });

            const totalMonto = pagadosCount * precioBoleto;
            document.getElementById('totalRecaudado').innerText = `S/ ${totalMonto.toFixed(2)}`;
            document.getElementById('totalVendidos').innerText = registros.length;
            document.getElementById('totalDisponibles').innerText = Math.max(0, 100 - registros.length);
        }

        cargarDatos();
    </script>
</body>
</html>
